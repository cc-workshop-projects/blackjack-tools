<html>
<head>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script>
		$(document).ready(function(){
			var bet = 5;

			// check payout function
			$('#guess_button').click(function(){
				var max = Math.min(parseInt($('#maximum').val()));
				var min = Math.ceil(parseInt($('#minimum').val()));
				var streak = parseInt($('#streak_counter').text());
				if (chipCheckCorrect()) {
					alert("Correct!!! Hooray!!! Woohoo!!!"); 
					if ($('#fives_checkbox').is(":checked")) {
						bet = Math.floor(Math.floor(Math.random() * (max - min) + min) / 5) * 5
						$('#bet_number').text(bet.toString());
					} else {
						bet = Math.floor(Math.random() * (max - min) + min);
						$('#bet_number').text(bet.toString());
					}
					betNumberToChips(bet);
					$('#guess').val('');
					streak++;
				} else { 
					alert("Try Again"); 
					streak = 0;
				} 
				$('#streak_counter').text(streak.toString());
				$('#streak_counter').css("fontSize", (streak * 12).toString() + "px");
				resetChips();
			});

			// enter key
			$('#guess').keypress(function (e) {
				var key = e.which;
				if (key == 13) {
					$('#guess_button').click();
				}
			});
			$('#settings_button').click(function(){$('#settings').toggle();})

			$('#chips_or_text_payout').click(function() {
				$('#guess').toggle();
				$('.chips.payout').toggle();
			});

			$('#chips_or_text_bet').click(function() {
				$('#bet_number').toggle();
				$('.chips.bet').toggle();
			});


			function totalUpChips() {
				var sum = parseInt($('#1_chips').val() || 0) + 
				(parseInt($('#2andahalf_chips').val() || 0) * 2.5) +
				(parseInt($('#5_chips').val() || 0) * 5) +
				(parseInt($('#25_chips').val() || 0) * 25) +
				(parseInt($('#100_chips').val() || 0) * 100) +
				(parseInt($('#500_chips').val() || 0) * 500);
				return sum;
			} 

			function chipCheckCorrect() {
				//testing
				//return true;
				if ($('#chips').is(":hidden")) {
					return parseFloat($('#guess').val() || 0) == bet * parseFloat($('#payout_multiplier').val());
				} else {
					return totalUpChips() == bet * parseFloat($('#payout_multiplier').val());
				}
			}

			function resetChips() {
				$('#1_chips').val('');
				$('#2andahalf_chips').val('');
				$('#5_chips').val('');
				$('#25_chips').val('');
				$('#100_chips').val('');
				$('#500_chips').val('');
			}

			function betNumberToChips(betInt) {
				console.log(bet.toString());
				var chipAmounts = [0,0,0,0,0];
				var chipValues = [1,5,25,100,500];
				var val = 0;
				var rand = 0;
				while (val < betInt) {
					rand = Math.floor(Math.random() * chipValues.length);
					if (chipValues[rand] + val <= betInt) {
						chipAmounts[rand] = chipAmounts[rand] + 1;
						val += chipValues[rand];
					}
				}

				for (var i = 0; i < chipValues.length; i++){
					val = chipValues[i];
					if (chipAmounts[i] == 0) {
						$('.bet .chip-' + val.toString()).hide();
					} else {
						$('.bet .chip-' + val.toString()).show();
						$('#' + val.toString() + '_chips_bet').text(chipAmounts[i].toString() + "x");
					}
				}
				return chipAmounts;
			}

			// start with settings hidden
			$('#bet_number').toggle();
			$('#settings').toggle();
			$('#guess').toggle();
			betNumberToChips(bet);
			resetChips();

		});
	</script>

	<style>
		body {
			display: flex;
			justify-content: center; 
			align-items: center; 
			flex-wrap: wrap;
		}

		.break {
			flex-basis: 100%;
			height: 0;
			margin: 10px;
		}

		.settings {
			border: 1px;
			border-style: solid;
			border-color: black;
		}

		.bet-was {
			font-size: 20px;
		}

		.chips {
			display: flex;
			align-items: center; 
		}

		.chip {
			border-radius: 50px; 
			width: 100px; 
			height: 100px; 
			display: flex;
			justify-content: center; 
			align-items: center; 
			flex-wrap: wrap;
			margin: 5px;
		}

		.chip-1 {
			border: 1px;
			border-style: solid;
			border-color: black;
		}

		.chip-2andahalf {
			background-color: pink;
		}

		.chip-5 {
			background-color: red;
		}

		.chip-25 {
			background-color: green;
		}
		.chip-100 {
			background-color: black;
		}
		.chip-500 {
			background-color: purple;
		}

		.chip-input {
			width: 50px; 
			height: 20px; 
			margin-top: 30%;
		}

		.chip-value {
			color: white; 
			margin-left: 50%; 
			margin-right: 50%;
		}
		.chip-1 .chip-value {
			color: black; 
		}

	</style>
</head>
<body>
	<button id="settings_button">show/hide settings</button>
	<div class="break"></div>
	<div id="settings" class="settings">
		<div class="break"></div>
		Minimum Bet: <input id="minimum" value="0" type="number"/>
		<div class="break"></div>
		Maximum Bet: <input id="maximum" value="100" type="number"/>
		<div class="break"></div>
		Bet is Only Multiples of 5: <input id="fives_checkbox" type="checkbox" checked/>
		<div class="break"></div>
		Payout Multiplier: <input id="payout_multiplier" value="1.5" type="number"/>
		<div class="break"></div>
		<button id="chips_or_text_bet">Switch Bet Chips/Textbox</button>
		<div class="break"></div>
		<button id="chips_or_text_payout">Switch Payout Chips/Textbox</button>
		<div class="break"></div>
	</div>
	<div class="break"></div>
	<div class="bet-was">BET WAS:  <strong id="bet_number">5</strong></div>
	<div class="chips bet">
		<div class="chip chip-1">
			<div id="1_chips_bet" class="chip-value">0x</div>
			<div class="chip-value">1</div>
		</div>
		<div class="chip chip-5">
			<div id="5_chips_bet" class="chip-value">0x</div>
			<div class="chip-value">5</div>
		</div>
		<div class="chip chip-25">
			<div id="25_chips_bet" class="chip-value">0x</div>
			<div class="chip-value">25</div>
		</div>
		<div class="chip chip-100">
			<div id="100_chips_bet" class="chip-value">0x</div>
			<div class="chip-value">100</div>
		</div>
		<div class="chip chip-500">
			<div id="500_chips_bet" class="chip-value">0x</div>
			<div class="chip-value">500</div>
		</div>
	</div>

	<div class="break"></div>
	<div class="chips payout">
		<div class="chip chip-1">
			<input id="1_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">1</div>
		</div>
		<div class="chip chip-2andahalf">
			<input id="2andahalf_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">2.5</div>
		</div>
		<div class="chip chip-5">
			<input id="5_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">5</div>
		</div>
		<div class="chip chip-25">
			<input id="25_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">25</div>
		</div>
		<div class="chip chip-100">
			<input id="100_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">100</div>
		</div>
		<div class="chip chip-500">
			<input id="500_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">500</div>
		</div>
	</div>
	<div class="break"></div>
	<input id="guess" type="number" pattern="[0-9]*"></input>
	<button id="guess_button">Check Payout Calculation</button>
	<div class="break"></div>
	Your Streak: 
	<div class="break"></div>
	<div id="streak_counter" style="font-size: 10px;">0</div>


</body>
</html>
