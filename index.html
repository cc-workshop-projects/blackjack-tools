<html>
<head>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script>
		$(document).ready(function(){

			// check payout function
			$('#guess_button').click(function(){
				var streak = parseInt($('#streak_counter').text());
				if (chipCheckCorrect()) {
					alert("Correct!!! Hooray!!! Woohoo!!!"); 
					if ($('#fives_checkbox').is(":checked")) {
						$('#number').text((Math.floor(Math.ceil(Math.random() * (parseInt($('#maximum').val())) / 5) * 5)).toString());
					} else {
						$('#number').text((Math.floor(Math.random() * parseInt($('#maximum').val()))).toString());
					}
					$('#guess').val('0');
					streak++;
				} else { 
					alert("Try Again"); 
					streak = 0;
				} 
				$('#streak_counter').text(streak.toString());
				$('#streak_counter').css("fontSize", (streak * 12).toString() + "px");
				resetChips();
			});

			// enter key
			$('#guess').keypress(function (e) {
				var key = e.which;
				if (key == 13) {
					$('#guess_button').click();
				}
			});
			$('#settings_button').click(function(){$('#settings').toggle();})

			$('#chips_or_text_button').click(function() {
				$('#guess').toggle();
				$('#chips').toggle();
			});

			function totalUpChips() {
				var sum = parseInt($('#1_chips').val()) + 
				(parseInt($('#2andahalf_chips').val()) * 2.5) +
				(parseInt($('#5_chips').val()) * 5) +
				(parseInt($('#25_chips').val()) * 25) +
				(parseInt($('#100_chips').val()) * 100) +
				(parseInt($('#500_chips').val()) * 500);
				return sum;
			} 

			function chipCheckCorrect() {
				if ($('#chips').is(":hidden")) {
					return parseFloat($('#guess').val()) == parseFloat($('#number').text()) * parseFloat($('#payout_multiplier').val());
				} else {
					return totalUpChips() == parseFloat($('#number').text()) * parseFloat($('#payout_multiplier').val());
				}
			}

			function resetChips() {
				$('#1_chips').val('0');
				$('#2andahalf_chips').val('0');
				$('#5_chips').val('0');
				$('#25_chips').val('0');
				$('#100_chips').val('0');
				$('#500_chips').val('0');
			}

			// start with settings hidden
			$('#settings').toggle();
			$('#guess').toggle();
			resetChips();

		});
	</script>

	<style>
		body {
			display: flex;
			justify-content: center; 
			align-items: center; 
			flex-wrap: wrap;
		}

		.break {
			flex-basis: 100%;
			height: 0;
			margin: 10px;
		}

		.settings {
			border: 1px;
			border-style: solid;
			border-color: black;
		}

		.chips {
			display: flex;
			align-items: center; 
		}

		.chip {
			border-radius: 50px; 
			width: 100px; 
			height: 100px; 
			display: flex;
			justify-content: center; 
			align-items: center; 
			flex-wrap: wrap;
			margin: 5px;
		}

		.chip-1 {
			border: 1px;
			border-style: solid;
			border-color: black;
		}

		.chip-2andahalf {
			background-color: pink;
		}

		.chip-5 {
			background-color: red;
		}

		.chip-25 {
			background-color: green;
		}
		.chip-100 {
			background-color: black;
		}
		.chip-500 {
			background-color: purple;
		}

		.chip-input {
			width: 50px; 
			height: 20px; 
			margin-top: 30%;
		}

		.chip-value {
			color: white; 
			margin-left: 50%; 
			margin-right: 50%;
		}
		.chip-1 .chip-value {
			color: black; 
		}

	</style>
</head>
<body>
	<button id="settings_button">show/hide settings</button>
	<div class="break"></div>
	<div id="settings" class="settings">
		<div class="break"></div>
		Maximum Bet: <input id="maximum" value="100" type="number"/>
		<div class="break"></div>
		Bet is Only Multiples of 5: <input id="fives_checkbox" type="checkbox" checked/>
		<div class="break"></div>
		Payout Multiplier: <input id="payout_multiplier" value="1.5" type="number"/>
		<div class="break"></div>
		<button id="chips_or_text_button">Switch Payout Input Chips/Textbox</button>
		<div class="break"></div>
	</div>
	<div class="break"></div>
	<div style="font-size: 20px;">BET WAS:  <strong id="number">5</strong></div>
	<div class="break"></div>
	<div class="chips" id="chips">
		<div class="chip chip-1">
			<input id="1_chips" type="number" value="0" class="chip-input"></input pattern="[0-9]*">
			<div class="chip-value">1</div>
		</div>
		<div class="chip chip-2andahalf">
			<input id="2andahalf_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">2.5</div>
		</div>
		<div class="chip chip-5">
			<input id="5_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">5</div>
		</div>
		<div class="chip chip-25">
			<input id="25_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">25</div>
		</div>
		<div class="chip chip-100">
			<input id="100_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">100</div>
		</div>
		<div class="chip chip-500">
			<input id="500_chips" type="number" value="0" class="chip-input" pattern="[0-9]*"></input>
			<div class="chip-value">500</div>
		</div>
	</div>
	<div class="break"></div>
	<input id="guess" type="number" pattern="[0-9]*"></input>
	<button id="guess_button">Check Payout Calculation</button>
	<div class="break"></div>
	Your Streak: 
	<div class="break"></div>
	<div id="streak_counter" style="font-size: 10px;">0</div>


</body>
</html>
